server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Ruta de salud para Coolify
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nunca servir archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    # HTML siempre fresco (los módulos ya usan ?v= para el caché)
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript text/plain application/json image/svg+xml;
}
