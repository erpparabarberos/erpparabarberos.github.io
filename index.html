<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PB</title>

    <link rel="icon" type="image/jpeg" href="https://erpparabarberos.github.io/logo-nexus.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        :root {
            --login-bg: #070d1d;
            --login-bg-2: #0b1630;
            --login-card: rgba(8, 15, 32, 0.72);
            --login-border: rgba(96, 165, 250, 0.32);
            --login-blue: #3b82f6;
            --login-blue-2: #1d4ed8;
            --login-text: #f8fafc;
            --login-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            min-height: 100vh;
            background: var(--login-bg);
            color: var(--login-text);
            overflow: hidden;
        }

        .login-page {
            position: relative;
            min-height: 100vh;
            width: 100%;
            display: grid;
            grid-template-columns: 46% 54%;
            align-items: center;
            padding: 48px 7vw;
            background:
                radial-gradient(circle at 6% 92%, rgba(59, 130, 246, 0.50) 0%, rgba(59, 130, 246, 0.22) 5%, transparent 18%),
                radial-gradient(circle at 82% 8%, rgba(37, 99, 235, 0.18) 0%, transparent 32%),
                linear-gradient(115deg, #0b1327 0%, #070d1d 48%, #030712 100%);
        }

        .login-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(255,255,255,0.09) 0 1px, transparent 1px 100%),
                linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 100%);
            background-size: 120px 120px;
            opacity: 0.10;
            pointer-events: none;
        }

        .login-page::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 42px;
            width: 55%;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, rgba(59,130,246,0.95) 18%, rgba(59,130,246,0.45) 55%, transparent 100%);
            box-shadow: 0 0 28px rgba(59,130,246,0.85);
            pointer-events: none;
        }

        .login-left {
            position: relative;
            z-index: 2;
            height: 100%;
            min-height: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-corner-light {
            position: absolute;
            left: -7vw;
            bottom: -48px;
            width: 140px;
            height: 420px;
            border-left: 1px solid rgba(96,165,250,0.24);
            border-bottom: 1px solid rgba(96,165,250,0.34);
            box-shadow:
                inset 12px 0 24px rgba(59,130,246,0.08),
                0 0 44px rgba(59,130,246,0.30);
        }

        .login-corner-light::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 3px;
            height: 130px;
            background: linear-gradient(180deg, transparent, #60a5fa, #ffffff);
            box-shadow: 0 0 34px #3b82f6;
        }

.brand-block {
    position: relative;
    z-index: 2;
    transform: translateY(-20px) !important;
    text-align: center;
}

.brand-glow {
    position: absolute;
    inset: 50% auto auto 50%;
    width: 620px !important;
    height: 420px !important;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(96,165,250,0.42), transparent 68%) !important;
    filter: blur(18px) !important;
    z-index: -1;
}
        .brand-logo {
    width: 520px !important;
    max-width: 92% !important;
    height: auto !important;
    display: block !important;

    opacity: 1 !important;
    filter:
        brightness(1.85)
        contrast(1.35)
        drop-shadow(0 0 16px rgba(255,255,255,0.38))
        drop-shadow(0 0 34px rgba(96,165,250,0.45))
        drop-shadow(0 22px 32px rgba(0,0,0,0.58)) !important;
}

        .login-right {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: min(100%, 640px);
            min-height: 610px;
            padding: 74px 64px 38px;
            border-radius: 18px;
            background:
                linear-gradient(180deg, rgba(15,23,42,0.84), rgba(2,6,23,0.70)),
                rgba(15,23,42,0.72);
            border: 1px solid var(--login-border);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04) inset,
                0 22px 70px rgba(0,0,0,0.46),
                0 0 38px rgba(59,130,246,0.10);
            backdrop-filter: blur(18px);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 26%;
            width: 48%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #93c5fd, transparent);
            box-shadow: 0 0 18px rgba(96,165,250,0.9);
        }

        .login-card::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 76px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(148,163,184,0.20), transparent);
        }

.login-eyebrow {
    text-align: center;
    letter-spacing: 0.42em;
    color: #60a5fa;
    font-size: 20px !important;
    font-weight: 900 !important;
    text-transform: uppercase;
    margin-bottom: 22px !important;
    text-shadow: 0 0 14px rgba(96, 165, 250, 0.55);
}

        .login-title {
            text-align: center;
            font-size: 42px;
            line-height: 1.05;
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 18px;
            letter-spacing: -0.03em;
        }

        .login-subtitle {
            text-align: center;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.45;
            margin: 0 0 44px;
        }

        .login-subtitle strong {
            color: #ffffff;
            font-weight: 900;
        }

        #loginForm {
            position: relative;
            z-index: 2;
        }

        .login-field {
            margin-bottom: 24px;
        }

        .login-field label {
            display: block;
            color: #e2e8f0;
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 10px;
        }

        .login-input-wrap {
            position: relative;
        }

        .login-input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            color: #e5edf8;
            pointer-events: none;
        }

        .login-input-wrap input {
            width: 100%;
            height: 66px;
            padding: 0 56px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.26);
            background: rgba(15, 23, 42, 0.52);
            color: #f8fafc;
            font-size: 17px;
            font-weight: 600;
            outline: none;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .login-input-wrap input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .login-input-wrap input:focus {
            border-color: rgba(96,165,250,0.75);
            box-shadow:
                0 0 0 4px rgba(59,130,246,0.12),
                inset 0 1px 0 rgba(255,255,255,0.06);
            background: rgba(15, 23, 42, 0.68);
        }

        .password-eye {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
            color: #94a3b8;
            cursor: pointer;
        }

        .login-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin: 2px 0 30px;
            color: #cbd5e1;
            font-size: 15px;
        }

        .remember-row {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            user-select: none;
        }

        .remember-row input {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
        }

        .forgot-link {
            color: #60a5fa;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        #errorMessage {
            min-height: 22px;
            margin-bottom: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
        }

        #btnIngresar {
            width: 100%;
            height: 66px;
            border: 1px solid rgba(96,165,250,0.58);
            border-radius: 10px;
            background: linear-gradient(180deg, #315bd5 0%, #1e3fae 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            box-shadow:
                0 14px 30px rgba(37, 99, 235, 0.25),
                0 0 24px rgba(59,130,246,0.22),
                inset 0 1px 0 rgba(255,255,255,0.20);
            transition: all 0.2s ease;
        }

        #btnIngresar:hover {
            transform: translateY(-1px);
            background: linear-gradient(180deg, #3b72ff 0%, #2451d6 100%);
            box-shadow:
                0 16px 38px rgba(37, 99, 235, 0.34),
                0 0 30px rgba(59,130,246,0.30);
        }

        #btnIngresar:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .login-security {
            position: relative;
            z-index: 2;
            margin-top: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
        }

        .login-security svg {
            width: 18px;
            height: 18px;
            color: #93c5fd;
        }

        @media (max-width: 1100px) {
            .login-page {
                grid-template-columns: 1fr;
                padding: 36px 24px;
            }

            .login-left {
                display: none;
            }

            .login-card {
                max-width: 560px;
                min-height: auto;
                padding: 52px 36px 34px;
            }
        }

        @media (max-width: 560px) {
            body {
                overflow-y: auto;
            }

            .login-page {
                min-height: 100vh;
                padding: 22px 16px;
            }

            .login-card {
                padding: 42px 22px 30px;
                border-radius: 16px;
            }

            .login-title {
                font-size: 34px;
            }

            .login-subtitle {
                font-size: 15px;
            }

            .login-options {
                flex-direction: column;
                align-items: flex-start;
            }

            .login-input-wrap input,
            #btnIngresar {
                height: 58px;
            }
        }
    </style>
</head>

<body>
    <main class="login-page">
        <section class="login-left">
            <div class="login-corner-light"></div>

            <div class="brand-block">
                <div class="brand-glow"></div>
                <img src="https://erpparabarberos.github.io/logo-nexus.jpg" alt="Logo Para Barberos" class="brand-logo">
            </div>
        </section>

        <section class="login-right">
            <div class="login-card">
                <div class="login-eyebrow">Bienvenido</div>
                <form id="loginForm">
                    <div class="login-field">
                        <label for="email">Correo electrónico</label>

                        <div class="login-input-wrap">
                            <svg class="login-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8m-18 8h18a2 2 0 002-2V8a2 2 0 00-2-2H3a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                            </svg>

                            <input type="email" id="email" required placeholder="usuario@parabarberos.com">
                        </div>
                    </div>

                    <div class="login-field">
                        <label for="password">Contraseña</label>

                        <div class="login-input-wrap">
                            <svg class="login-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c1.104 0 2-.896 2-2V7a2 2 0 10-4 0v2c0 1.104.896 2 2 2zm-6 0h12v10H6V11z"></path>
                            </svg>

                            <input type="password" id="password" required placeholder="••••••••">

                            <svg class="password-eye" fill="none" stroke="currentColor" viewBox="0 0 24 24" onclick="toggleLoginPassword()">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.46 12C3.73 7.94 7.52 5 12 5c4.48 0 8.27 2.94 9.54 7-1.27 4.06-5.06 7-9.54 7-4.48 0-8.27-2.94-9.54-7z"></path>
                            </svg>
                        </div>
                    </div>

                    <div class="login-options">
                        <label class="remember-row">
                            <input type="checkbox" checked>
                            <span>Recordarme en este dispositivo</span>
                        </label>

                        <a href="#" class="forgot-link" onclick="return false;">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div id="errorMessage"></div>

                    <button type="submit" id="btnIngresar">
                        Ingresar al sistema
                    </button>
                </form>

                <div class="login-security">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2l7 4v6c0 5-3.5 9.5-7 10-3.5-.5-7-5-7-10V6l7-4z"></path>
                    </svg>
                    <span>Acceso seguro y encriptado</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        function toggleLoginPassword() {
            const input = document.getElementById('password');
            if (!input) return;
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.addEventListener('DOMContentLoaded', () => {
            
            // TUS LLAVES REALES INTEGRADAS CORRECTAMENTE EN MODO "COMPAT"
            const firebaseConfig = {
                apiKey: "AIzaSyDkH2_E7t07SWWH1SZr77BFlNp6RQTDDDY",
                authDomain: "erpparabarberos-12de9.firebaseapp.com",
                projectId: "erpparabarberos-12de9",
                storageBucket: "erpparabarberos-12de9.firebasestorage.app",
                messagingSenderId: "722745790519",
                appId: "1:722745790519:web:7bf1dbe172433898a56fb2"
            };

            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');
            const btnIngresar = document.getElementById('btnIngresar');

            auth.onAuthStateChanged(user => {
                if (user && localStorage.getItem('userRole')) {
                    window.location.href = 'app.html';
                }
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim().toLowerCase();
                const password = document.getElementById('password').value;
                
                errorMessage.textContent = 'Autenticando y verificando permisos...';
                errorMessage.className = 'text-slate-300 text-sm text-center font-bold h-auto';
                btnIngresar.disabled = true;
                btnIngresar.textContent = 'Validando acceso...';

                auth.signInWithEmailAndPassword(email, password)
                    .then(() => {
                        return db.collection('usuarios').doc(email).get();
                    })
                    .then((doc) => {
                        if (doc.exists) {
                            localStorage.setItem('userRole', doc.data().rol);
                            window.location.href = 'app.html';
                        } else {
                            auth.signOut();
                            throw new Error("sin-rol");
                        }
                    })
                    .catch((error) => {
                        btnIngresar.disabled = false;
                        btnIngresar.textContent = 'Ingresar al sistema';
                        errorMessage.className = 'text-red-400 text-sm text-center font-bold h-auto leading-tight';
                        
                        console.error("Detalle del error:", error);

                        if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                            errorMessage.textContent = 'Contraseña incorrecta o usuario no encontrado.';
                        } else if (error.message === "sin-rol") {
                            errorMessage.textContent = 'Acceso denegado: El correo existe, pero no tiene un rol asignado en la base de datos.';
                        } else {
                            errorMessage.textContent = 'Error: ' + error.message; 
                        }
                    });
            });
        });
    </script>
</body>
</html>
